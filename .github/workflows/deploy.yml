name: Deploy to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SITE_URL: ${{ vars.SITE_URL }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Resolve Cloudflare database and public origin
        run: node scripts/prepare-cloudflare.mjs
      - run: npm run build
      - run: npx wrangler deploy --dry-run --config .cloudflare-deploy.json
      - name: Apply production D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config .cloudflare-deploy.json
      - name: Deploy Worker and static assets
        run: npx wrangler deploy --config .cloudflare-deploy.json
